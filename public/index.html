<!DOCTYPE html>
<html lang="en" xml:lang="en">

<head>
  <meta charset="UTF-8" />
  <title>µcBlockly</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <!-- CSP via meta: frame-ancestors is NOT supported in meta (browser warning) — set it on the server if needed. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: ws: wss:; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png?v=2">
  <link rel="icon" href="assets/favicon.ico?v=2" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=2">
</head>

<body>
  <a href="#blockly-workspace-main" class="skip-link lang" key="A11Y_SKIP_TO_WORKSPACE"
    id="skip-to-workspace">Aller au workspace Blockly</a>
  <flex id="container_page" class="wrapper_global">
    <header id="app_topbar" class="divTableCell">
      <div id="title" class="app-title">
        <img class="app-title__logo" src="assets/favicon-32x32.png?v=2" alt="" width="32" height="32" decoding="async">
        <span class="lang" key="HOME">µcBlockly</span>
      </div>
      <button type="button" id="aboutButton" class="toolbar-btn lang" key="ABOUT"
        data-title-key="ABOUT_TOOLTIP">About</button>
      <a href="https://www.linkedin.com/in/sebcanet/" target="_blank">
        <span class="lang" key="CONTACT" data-title-key="CONTACT_TOOLTIP">Contact</span>
      </a>
      <button type="button" id="saveButton" class="toolbar-btn lang" key="SAVE"
        data-title-key="SAVE_TOOLTIP">save</button>
      <button type="button" id="loadButton" class="toolbar-btn lang" key="LOAD"
        data-title-key="LOAD_TOOLTIP">load</button>
      <input type="file" id="loadFileInput" accept=".json" hidden aria-hidden="true" tabindex="-1">
      <button type="button" id="undoButton" class="toolbar-btn lang" key="UNDO"
        data-title-key="UNDO_TOOLTIP">undo</button>
      <button type="button" id="redoButton" class="toolbar-btn lang" key="REDO"
        data-title-key="REDO_TOOLTIP">redo</button>
      <button type="button" id="shortcutsHelpButton" class="toolbar-btn lang" key="SHORTCUTS_HELP_BUTTON"
        data-title-key="SHORTCUTS_HELP_TOOLTIP">shortcuts</button>
      <button type="button" id="keyboardTutorialButton" class="toolbar-btn lang" key="KEYBOARD_TUTORIAL_BUTTON"
        data-title-key="KEYBOARD_TUTORIAL_TOOLTIP">tutorial</button>
      <select id="languageMenu" data-title-key="LANGUAGE_MENU_TOOLTIP"></select>
      <select name="rendererMenu" id="rendererMenu" data-title-key="RENDERER_MENU_TOOLTIP">
        <option class="lang" value="geras" id="rendererGeras" key="RENDERER_GERAS">geras</option>
        <option class="lang" value="thrasos" id="rendererThrasos" key="RENDERER_THRASOS">thrasos</option>
        <option class="lang" value="zelos" id="rendererZelos" key="RENDERER_ZELOS">zelos</option>
        <option class="lang" value="minimalist" id="rendererMinimalist" key="RENDERER_MINI">minimalist</option>
      </select>
      <select name="themeMenu" id="themeMenu" data-title-key="THEME_MENU_TOOLTIP">
        <option class="lang" value="classic" id="themeClassicSpan" key="THEME_CLASSIC">classic</option>
        <option class="lang" value="modern" id="themeModernSpan" key="THEME_MODERN">modern</option>
        <option class="lang" value="deuteranopia" id="themeDeuteranopiaSpan" key="THEME_DEUTERANOPIA">deuteranopia</option>
        <option class="lang" value="tritanopia" id="themeTritanopiaSpan" key="THEME_TRITANOPIA">tritanopia</option>
        <option class="lang" value="zelos" id="themeZelosSpan" key="THEME_ZELOS">zelos</option>
        <option class="lang" value="high_contrast" id="themeHighContrastSpan" key="THEME_HIGHCONTRAST">high_contrast</option>
        <option class="lang" value="dark" id="themeDarkSpan" key="THEME_DARK">dark</option>
        <option class="lang" value="hacker" id="themeHackerSpan" key="THEME_HACKER">hacker</option>
        <option class="lang" value="seshat" id="themeSeshatSpan" key="THEME_SESHAT">seshat</option>
        <option class="lang" value="blackWhite" id="themeBwSpan" key="THEME_BLACKWHITE">blackWhite</option>
      </select>
      <select name="boardMenu" id="boardMenu" data-title-key="BOARD_MENU_TOOLTIP"></select>
      <div id="pluginOptions">
        <label id="pluginOptionMinimap" class="plugin-option">
          <input type="checkbox" id="pluginMinimap" data-title-key="PLUGIN_MINIMAP_TOOLTIP" />
          <span class="lang" key="PLUGIN_MINIMAP" data-title-key="PLUGIN_MINIMAP_TOOLTIP">minimap</span>
        </label>
        <label id="pluginOptionHighlight" class="plugin-option">
          <input type="checkbox" id="pluginHighlight" data-title-key="PLUGIN_HIGHLIGHT_TOOLTIP" />
          <span class="lang" key="PLUGIN_HIGHLIGHT" data-title-key="PLUGIN_HIGHLIGHT_TOOLTIP">highlight</span>
        </label>
        <label id="pluginOptionContinuousToolbox" class="plugin-option">
          <input type="checkbox" id="pluginContinuousToolbox" data-title-key="PLUGIN_CONTINUOUSTOOLBOX_TOOLTIP" />
          <span class="lang" key="PLUGIN_CONTINUOUSTOOLBOX" data-title-key="PLUGIN_CONTINUOUSTOOLBOX_TOOLTIP">toolbox</span>
        </label>
        <label id="pluginOptionAlwaysOpenedFlyout" class="plugin-option">
          <input type="checkbox" id="alwaysOpenedToolboxFlyout" data-title-key="ALWAYS_OPEN_FLYOUT_TOOLTIP" />
          <span class="lang" key="ALWAYS_OPEN_FLYOUT" data-title-key="ALWAYS_OPEN_FLYOUT_TOOLTIP">toujours ouverte</span>
        </label>
        <label id="pluginOptionCodeEditor" class="plugin-option">
          <input type="checkbox" id="codeEditorSwitch" data-title-key="CODE_EDITOR_TOOLTIP" />
          <span class="lang" key="CODE_EDITOR" data-title-key="CODE_EDITOR_TOOLTIP">editor</span>
        </label>
        <label id="pluginOptionDebug" class="plugin-option">
          <input type="checkbox" id="debugSwitch" data-title-key="PLUGIN_DEBUG_TOOLTIP" />
          <span class="lang" key="PLUGIN_DEBUG" data-title-key="PLUGIN_DEBUG_TOOLTIP">debug</span>
        </label>
      </div>
    </header>
      <flex id="flex_container_up" class="wrapper_element" dir="ltr" style="flex: 1;">
      <flex-item id="flex_container_up_left" style="flex: 1;">
        <div id="shortcuts" hidden></div>
        <div id="a11y-announcer" hidden></div>
        <main id="blockly-workspace-main">
          <div id="div_workspace_content_area"></div>
          <div id="div_workspace_content_blockly" style="position: absolute"></div>
        </main>
      </flex-item>
      <flex-resizer id="flex_resizer_horizontal"></flex-resizer>
      <flex-item id="flex_container_up_right" style="flex-basis: 0px;">
        <flex-item id="flex_content_code">
          <pre id="div_content_code"><code></code></pre>
          <div id="div_content_monacoEditor"></div>
        </flex-item>
      </flex-item>
    </flex>
    <flex-resizer id="flex_resizer_vertical"></flex-resizer>
    <flex id="flex_container_bottom" class="wrapper_element" style="flex-basis: 0px;">
      <flex-item id="flex_container_bottom_down" style="flex: 1;" role="presentation">
        <pre id="content_console"><code></code></pre>
      </flex-item>
    </flex>
  </flex>
</body>

</html>
