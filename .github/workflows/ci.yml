name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # ucBlockly is private: the default Actions token cannot clone it.
      - name: Fetch ucBlockly
        env:
          UCBLOCKLY_READ_TOKEN: ${{ secrets.UCBLOCKLY_READ_TOKEN }}
        run: >
          git -c url."https://x-access-token:${UCBLOCKLY_READ_TOKEN}@github.com/".insteadOf="https://github.com/"
          submodule update --init --recursive --depth 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
